name: Sync Spoken English from Google Drive

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs automatically every 6 hours
  workflow_dispatch:        # Allows manual 1-click trigger in GitHub Actions tab
  push:
    paths:
      - 'source_pdfs/**.pdf' # Automatically triggers whenever a PDF is uploaded to source_pdfs/
  repository_dispatch:      # Allows Google Apps Script / Drive webhook triggers
    types: [new_spoken_pdf, sync_spoken]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pypdfium2 gdown requests

      - name: Download & Process New Lessons from Google Drive
        env:
          SPOKEN_SYNC_SECRET: ${{ secrets.SPOKEN_SYNC_SECRET || 'sapthagiri-spoken-sync-2026' }}
        run: |
          python scripts/sync_spoken_drive.py

      - name: Commit & Push New Sliced PDFs and Lessons Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Portal/spoken_pdf/ Portal/data/spoken-english-lessons.js scripts/
          if git diff --staged --quiet; then
            echo "No new Spoken English lessons to commit."
          else
            git commit -m "chore(spoken-english): auto-sync new day lessons from Google Drive"
            # Pull with rebase first in case concurrent commits landed on remote
            git pull --rebase origin main || true
            git push origin main
          fi
