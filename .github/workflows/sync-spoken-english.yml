name: Sync Spoken English from Google Drive

on:
  # Schedule, push and repository_dispatch triggers disabled: Spoken English lessons are published from the portal.
  # Manual runs only.
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pypdfium2 gdown requests

      - name: Download & Process New Lessons from Google Drive
        env:
          SPOKEN_SYNC_SECRET: ${{ secrets.SPOKEN_SYNC_SECRET }}
        run: |
          python scripts/sync_spoken_drive.py

      - name: Commit & Push New Sliced PDFs and Lessons Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Portal/spoken_pdf/ Portal/data/spoken-english-lessons.js scripts/
          if git diff --staged --quiet; then
            echo "No new Spoken English lessons to commit."
          else
            git commit -m "chore(spoken-english): auto-sync new day lessons from Google Drive"
            # Pull with rebase first in case concurrent commits landed on remote
            git pull --rebase origin main || true
            git push origin main
          fi
