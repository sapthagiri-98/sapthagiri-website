<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>Fee Follow-up · Sapthagiri Portal</title>
  <link rel="icon" href="../logo-mark.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&family=Noto+Sans+Telugu:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="portal.css">
  <style>
    .fu-wrap{max-width:1180px;margin:0 auto;padding:4px 0 28px}
    .fu-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 4px}
    .fu-title h2{margin:0;font-size:1.25rem;color:#0f172a}
    .fu-note{color:#64748b;font-size:.82rem;margin:0 0 14px}
    .fu-chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
    .fu-chip{border:1px solid #e2e8f0;background:#fff;border-radius:999px;padding:7px 13px;font-size:.82rem;font-weight:600;color:#475569;cursor:pointer}
    .fu-chip b{margin-left:5px;color:#0f172a}.fu-chip.on{background:#800000;border-color:#800000;color:#fff}.fu-chip.on b{color:#fff}
    .fu-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
    .fu-bar input[type=text],.fu-bar select{padding:9px 12px;border:1px solid #e2e8f0;border-radius:10px;font-size:.9rem;background:#fff}
    .fu-bar input[type=text]{flex:1 1 220px}
    .fu-list{display:grid;gap:10px}
    .fu-card{background:#fff;border:1px solid #e6e8ee;border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(0,2.3fr) auto;gap:12px;align-items:center}
    @media(max-width:820px){.fu-card{grid-template-columns:1fr}}
    .fu-name{font-weight:700;color:#0f172a}.fu-sub{color:#94a3b8;font-size:.78rem}
    .fu-reason{font-size:.88rem;color:#334155;margin:4px 0 0}
    .fu-badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.72rem;font-weight:700;margin-right:6px}
    .b-met{background:#dcfce7;color:#166534}.b-not{background:#fee2e2;color:#991b1b}.b-hold{background:#e0f2fe;color:#075985}.b-ver{background:#fef3c7;color:#92400e}.b-pri{background:#fde68a;color:#78350f}.b-ref{background:#ede9fe;color:#5b21b6}
    .fu-act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
    .fu-btn{border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:6px 11px;font-size:.8rem;font-weight:600;cursor:pointer;color:#334155}
    .fu-btn:hover{border-color:#800000;color:#800000}.fu-btn.primary{background:#800000;border-color:#800000;color:#fff}
    .fu-empty{background:#fff;border:1px dashed #cbd5e1;border-radius:14px;padding:26px;text-align:center;color:#64748b}
    .fu-restrict{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:10px;padding:6px 10px;font-size:.8rem;margin-top:6px}
    .fu-tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
    .fu-tab{padding:8px 15px;border-radius:999px;background:#f1f5f9;font-weight:700;font-size:.82rem;color:#64748b;cursor:pointer}.fu-tab.on{background:#800000;color:#fff}
    table.fu-t{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e6e8ee;border-radius:12px;overflow:hidden;font-size:.85rem}
    .fu-t th,.fu-t td{padding:9px 10px;border-bottom:1px solid #eef1f6;text-align:left;vertical-align:top}.fu-t th{background:#f8fafc;color:#475569;font-size:.72rem;text-transform:uppercase}
    .fu-dlg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:9999}
    .fu-dlg>div{background:#fff;border-radius:14px;padding:18px;width:min(460px,94vw);max-height:90vh;overflow:auto}
    .fu-dlg label{display:block;font-size:.78rem;font-weight:700;color:#475569;margin:10px 0 4px}
    .fu-dlg input,.fu-dlg select,.fu-dlg textarea{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;box-sizing:border-box}
    .fu-dlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
    .fu-pol{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
    .fu-pol .f{background:#fff;border:1px solid #e6e8ee;border-radius:12px;padding:10px}.fu-pol label{font-size:.75rem;font-weight:700;color:#475569;display:block;margin-bottom:4px}
    .fu-pol input{width:100%;padding:7px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box}
  </style>
</head>
<body>
  <nav class="app-mobile-nav" id="mobileNav"></nav>
  <div class="app-body">
    <nav class="pv2-sidebar" id="nav"></nav>
    <main class="app-main">
      <div id="view"><div class="fu-wrap" id="fuRoot"><div class="fu-empty">Loading…</div></div></div>
    </main>
  </div>
  <script src="config.js"></script>
  <script src="portal.js"></script>
  <script src="class-followup.js"></script>
</body>
</html>
