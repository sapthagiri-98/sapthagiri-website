<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>Coming Soon · Sapthagiri Portal</title>
  <link rel="icon" href="../logo-mark.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&family=Noto+Sans+Telugu:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <nav class="app-mobile-nav" id="mobileNav"></nav>
  <div class="app-body">
    <nav class="pv2-sidebar" id="nav"></nav>
    <main class="app-main"><div id="view"></div></main>
  </div>
  <script src="config.js"></script>
  <script src="portal.js"></script>
  <script>
  (function () {
    var P = window.Portal;
    var session = P.Session.require();
    if (!session) return;
    P.renderChrome({ app: true, userName: session.name });
    P.renderNav("", session);
    var title = decodeURIComponent((location.search.match(/[?&]m=([^&]+)/) || [])[1] || "Module").replace(/\+/g, " ");
    document.getElementById("view").innerHTML =
      '<div class="card"><div class="soon-wrap">' +
      '<div class="soon-icon"><i class="material-icons">hourglass_top</i></div>' +
      '<h2 style="color:var(--maroon);">' + P.esc(title) + '</h2>' +
      '<p class="view-description" style="margin:6px auto 18px;">This module is <strong>Coming Soon</strong>. Attendance, the Homework Diary and Attendance logs are ready today.</p>' +
      '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">' +
      '<a class="btn btn-maroon" style="width:auto;" href="attendance.html">Open Attendance</a>' +
      '<a class="btn btn-secondary" style="width:auto;" href="homework.html">Open Homework Diary</a>' +
      '</div></div></div>';
  })();
  </script>
</body>
</html>
