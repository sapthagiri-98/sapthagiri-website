<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>Fees &amp; Ledger · View</title>

  <link rel="icon" href="../logo-mark.jpg">

  <!-- Use the same font/icon stack and app shell as Syllabus Tracker. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&family=Noto+Sans+Telugu:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="portal.css">
</head>

<body>
  <!-- IMPORTANT:
       These class names intentionally match the working Syllabus Tracker
       mobile shell. portal.js / portal.css use these names for the header,
       sidebar, main layout and horizontal mobile bottom navigation. -->
  <nav class="app-mobile-nav" id="mobileNav"></nav>

  <div class="app-body">
    <nav class="pv2-sidebar" id="nav"></nav>

    <main class="app-main">
      <div id="view"></div>
    </main>
  </div>

  <script src="config.js"></script>

  <script>
    (function () {
      /*
       * Fee ledger view is a mobile-only entry point.
       * Desktop users are redirected to the normal management page.
       */
      var w = window.innerWidth || document.documentElement.clientWidth || 9999;

      if (w >= 900) {
        location.replace("fee-management.html");
        return;
      }
    })();
  </script>

  <script src="portal.js"></script>
  <script src="fee-ledger-view.js"></script>
</body>
</html>
