<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>Payroll Management · Sapthagiri Portal</title>
  <link rel="icon" href="../logo-mark.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="portal.css">
  <style>
    .payroll-shell{max-width:1500px;margin:0 auto}
    .payroll-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}
    .payroll-head h1{margin:0;color:var(--maroon,#7a151a);font-family:Poppins,Inter,sans-serif}
    .payroll-head p{margin:5px 0 0;color:var(--text-muted,#667085);font-size:13px}
    .payroll-actions{display:flex;gap:8px;flex-wrap:wrap}
    .payroll-toolbar,.payroll-card{background:#fff;border:1px solid var(--border,#e5e7eb);border-radius:14px;box-shadow:0 5px 18px rgba(15,23,42,.05)}
    .payroll-toolbar{padding:13px;display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:14px}
    .field{display:flex;flex-direction:column;gap:5px}
    .field label{font-size:11px;font-weight:700;color:#667085}
    .field input,.field select,.field textarea{border:1px solid #d8dde5;border-radius:9px;padding:9px 10px;font:inherit;background:#fff;min-height:38px}
    .btn{border:0;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
    .btn-primary{background:#7a151a;color:#fff}.btn-light{background:#f4f6f8;color:#344054;border:1px solid #e2e5e9}.btn-success{background:#15803d;color:#fff}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .summary-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
    .summary-box{padding:13px 15px}.summary-label{font-size:11px;color:#667085;font-weight:700}.summary-value{font-size:20px;font-weight:800;margin-top:4px;color:#1f2937}
    .total-net{border-color:#b7ddc4;box-shadow:0 6px 22px rgba(21,128,61,.08)}
    .money{font-variant-numeric:tabular-nums}.net{font-weight:800;color:#087a3b}.deduct{color:#b42318;font-weight:700}
    .payroll-rule{margin-left:auto;color:#667085;font-size:12px;display:flex;align-items:center;gap:5px}.payroll-rule i{font-size:17px}
    .payroll-list{display:grid;gap:9px}
    .staff-row{display:grid;grid-template-columns:minmax(180px,1.55fr) repeat(7,minmax(75px,.7fr)) minmax(70px,.65fr) auto;gap:10px;align-items:center;padding:12px 13px}
    .staff-main{display:flex;align-items:flex-start;gap:10px;min-width:0}.staff-index{font-size:11px;color:#98a2b3;min-width:20px;padding-top:2px}.staff-name{min-width:0}
    .staff-name strong{display:block;font-size:13px;color:#202938;white-space:normal;line-height:1.25}.staff-name span{display:block;font-size:11px;color:#667085;margin-top:2px}.metric{min-width:0}.metric span,.row-status small{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.03em;color:#98a2b3;font-weight:700}.metric strong{display:block;font-size:12px;margin-top:3px;white-space:nowrap}
    .row-status{display:flex;flex-direction:column;align-items:flex-start;gap:3px}.status{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800}.status.pending{background:#fff4e5;color:#9a5b00}.status.paid{background:#eaf8ef;color:#137333}.status.unassigned{background:#f1f3f5;color:#667085}
    .row-actions{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}.mini{padding:6px 8px;font-size:11px}
    .row-note{display:flex;align-items:center;gap:3px;color:#8a5a00;font-size:10px;margin-top:4px;white-space:normal}.row-note i{font-size:13px}
    .adjustment{font-size:9px;border-radius:5px;padding:2px 4px;margin-left:3px}.adjustment.positive{background:#eaf8ef;color:#137333}.adjustment.negative{background:#fff0f0;color:#b42318}
    .empty-state{padding:34px;text-align:center;color:#667085}.empty-state i{display:block;font-size:30px;margin-bottom:6px}
    .assignment-panel{padding:16px}.assignment-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:12px}.muted{font-size:12px;color:#667085;margin-top:3px}
    .assignment-grid{display:grid;gap:8px}.assignment-item{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 2fr;gap:12px;align-items:center;padding:11px 12px;border:1px solid #edf0f2;border-radius:10px}.assignment-person strong{display:block}.assignment-person span,.assignment-label{display:block;font-size:10px;color:#667085}.assignment-note{font-size:11px;color:#667085}
    .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:9999}.modal-backdrop.show{display:flex}
    .modal{width:min(560px,100%);background:#fff;border-radius:16px;box-shadow:0 25px 80px rgba(0,0,0,.25);padding:20px}.modal h2{margin:0 0 5px;color:#7a151a;font-family:Poppins}.modal p{margin:0 0 15px;color:#667085;font-size:13px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .full{grid-column:1/-1}.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.lock-icon{width:46px;height:46px;border-radius:50%;background:#f7e9e8;color:#7a151a;display:grid;place-items:center;margin-bottom:10px}.notice{padding:10px 12px;border-radius:9px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:12px;margin-bottom:12px}
    .adjustment-note{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:#667085;background:#f8fafc;border:1px solid #edf0f2;padding:10px;border-radius:9px;margin-top:12px}.adjustment-note i{font-size:18px}
    .tabs{display:flex;gap:6px;margin-bottom:14px}.tab{padding:8px 13px;border-radius:999px;border:1px solid #e1e5ea;background:#fff;font-weight:700;color:#667085;cursor:pointer}.tab.active{background:#7a151a;color:#fff;border-color:#7a151a}

    .employee-panel{padding:16px}
    .employee-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
    .employee-kpis>div{padding:12px;border:1px solid #edf0f2;border-radius:10px;background:#fafbfc}
    .employee-kpis strong{display:block;font-size:20px;color:#202938}
    .employee-kpis span{font-size:11px;color:#667085}
    .employee-table-wrap{overflow-x:auto}
    .employee-table{width:100%;border-collapse:collapse;table-layout:fixed}
    .employee-table th,.employee-table td{padding:10px 8px;border-bottom:1px solid #edf0f2;text-align:left;font-size:12px;vertical-align:middle}
    .employee-table th{font-size:10px;text-transform:uppercase;color:#667085;letter-spacing:.04em}
    .employee-table td small{display:block;color:#98a2b3;margin-top:2px}
    .alias-chip{display:inline-block;padding:4px 7px;border-radius:6px;background:#fff3e8;color:#9a5b00;font-weight:700}
    .empty-cell{text-align:center!important;color:#667085;padding:28px!important}
    .employee-modal{max-width:650px}
    @media(max-width:900px){
      .employee-kpis{grid-template-columns:1fr}
      .employee-table{min-width:760px}
      .employee-table-wrap{overflow-x:auto}
    }
    .spin-icon{animation:payrollSpin 1s linear infinite}@keyframes payrollSpin{to{transform:rotate(360deg)}}
    @media(max-width:1200px){
      .staff-row{grid-template-columns:minmax(190px,1.6fr) repeat(4,minmax(75px,.8fr)) minmax(80px,.8fr) auto}
      .staff-row .metric:nth-of-type(5){display:none}
      .staff-row .metric:nth-of-type(6){display:none}
      .staff-row .row-status{grid-column:auto}
    }
    @media(max-width:900px){
      .payroll-head{align-items:flex-start;flex-direction:column}.summary-grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.payroll-toolbar{align-items:stretch}.field{min-width:0}.field select,.field input{width:100%}
      .payroll-rule{margin-left:0}.staff-row{grid-template-columns:1fr 1fr 1fr;gap:10px}.staff-main{grid-column:1/-1}.net-metric{grid-column:span 2}.row-actions{grid-column:1/-1;justify-content:flex-start}.row-status{grid-column:1/-1}
      .assignment-head{align-items:flex-start;flex-direction:column}.assignment-item{grid-template-columns:1fr 1fr}.assignment-note{grid-column:1/-1}
    }
  </style>
</head>
<body>
  <nav class="app-mobile-nav" id="mobileNav"></nav>
  <div class="app-body"><nav class="pv2-sidebar" id="nav"></nav><main class="app-main"><div id="view"></div></main></div>
  <div class="modal-backdrop" id="payrollPasswordModal"><div class="modal" style="max-width:410px"><div class="lock-icon"><i class="material-icons">lock</i></div><h2>Payroll access</h2><p>Enter the separate payroll password to open salary management.</p><div class="field"><label>Payroll Password</label><input id="payrollPassword" type="password" autocomplete="off"></div><div id="payrollPasswordError" class="notice" style="display:none;margin-top:10px"></div><div class="modal-footer"><button class="btn btn-primary" id="payrollUnlockBtn"><i class="material-icons">lock_open</i>Unlock Payroll</button></div></div></div>
  <div class="modal-backdrop" id="editModal"><div class="modal"><h2>Edit Payroll</h2><p id="editEmployee"></p><div class="form-grid"><div class="field"><label>Unpaid Leaves</label><input id="editUnpaid" type="number" min="0" step="0.5"></div><div class="field"><label>Deduction Override (₹)</label><input id="editDeduction" type="number" min="0" step="0.01"></div><div class="field"><label>Net Salary Override (₹)</label><input id="editNet" type="number" min="0" step="0.01"></div><div class="field"><label>Payment Mode</label><select id="editMode"><option>Bank Transfer</option><option>UPI</option><option>Cash</option><option>Cheque</option></select></div><div class="field full"><label>Reason / Comment</label><textarea id="editComment" rows="3" placeholder="Required when changing a calculated amount"></textarea></div></div><div class="modal-footer"><button class="btn btn-light" onclick="SalaryPayroll.closeEdit()">Cancel</button><button class="btn btn-primary" id="saveEditBtn">Save Changes</button></div></div></div>
  <div class="modal-backdrop" id="payModal"><div class="modal"><h2>Mark Salary as Paid</h2><p id="payEmployee"></p><div class="form-grid"><div class="field"><label>Net Salary to Transfer (₹)</label><input id="payAmount" type="number" min="0" step="0.01"></div><div class="field"><label>Pay Date</label><input id="payDate" type="date"></div><div class="field"><label>Payment Mode</label><select id="payMode"><option>Bank Transfer</option><option>UPI</option><option>Cash</option><option>Cheque</option></select></div><div class="field"><label>Reference</label><input id="payReference" type="text" placeholder="UTR / transaction reference"></div><div class="field full"><label>Comment</label><textarea id="payComment" rows="3" placeholder="Required if the amount differs from calculated net salary"></textarea></div></div><div class="modal-footer"><button class="btn btn-light" onclick="SalaryPayroll.closePay()">Cancel</button><button class="btn btn-success" id="confirmPayBtn"><i class="material-icons">check_circle</i>Mark Paid</button></div></div></div>
  <script src="config.js"></script><script src="portal.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="salary-management.js?v=20260820-3"></script>
</body></html>
