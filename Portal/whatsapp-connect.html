<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WhatsApp Coexistence Onboarding</title>
</head>
<body>
  <h2>Connect WhatsApp Business App (Coexistence)</h2>
  <button onclick="launchWhatsAppSignup()" style="padding: 12px 24px; font-size: 16px; cursor: pointer;">
    Connect Existing WhatsApp Number
  </button>

  <script>
    window.fbAsyncInit = function() {
      FB.init({
        appId            : '2972537683097915',
        autoLogAppEvents : true,
        xfbml            : true,
        version          : 'v20.0'
      });
    };

    (function(d, s, id){
       var js, fjs = d.getElementsByTagName(s)[0];
       if (d.getElementById(id)) {return;}
       js = d.createElement(s); js.id = id;
       js.src = "https://connect.facebook.net/en_US/sdk.js";
       fjs.parentNode.insertBefore(js, fjs);
    }(document, 'script', 'facebook-jssdk'));

    window.addEventListener('message', (event) => {
      if (event.origin !== "https://www.facebook.com" && event.origin !== "https://web.facebook.com") {
        return;
      }
      try {
        const data = JSON.parse(event.data);
        if (data.type === 'WA_EMBEDDED_SIGNUP') {
          console.log('Embedded Signup Data:', data);
        }
      } catch (e) {}
    });

    function launchWhatsAppSignup() {
      FB.login(function(response) {
        if (response.authResponse) {
          console.log('Login successful. Token:', response.authResponse.accessToken);
        } else {
          console.log('User cancelled login or did not fully authorize.');
        }
      }, {
        scope: 'whatsapp_business_management,whatsapp_business_messaging',
        response_type: 'code',
        override_default_response_type: true,
        extras: {
          setup: {},
          featureType: '',
          sessionInfoVersion: '3'
        }
      });
    }
  </script>
</body>
</html>
